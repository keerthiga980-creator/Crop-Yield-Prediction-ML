<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crop Yield Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e8f5e9, #f1f8e9);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            line-height: 1.5;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: #4caf50;
        }

        .predict-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #2e7d32;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .predict-btn:hover {
            background: #1b5e20;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            background: #f1f8e9;
            text-align: center;
            display: none;
        }

        .result h2 {
            color: #2e7d32;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: 28px;
            font-weight: bold;
            color: #1b5e20;
        }

        .error {
            margin-top: 15px;
            color: #c62828;
            text-align: center;
            display: none;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🌾 Crop Yield Prediction</h1>
        <p>
            Predict crop yield using agricultural and environmental factors
            with a Machine Learning model.
        </p>
    </div>

    <form id="predictionForm">

        <div class="form-grid">

            <div class="form-group">
                <label for="area">Area</label>
                <input
                    type="text"
                    id="area"
                    value="India"
                    required
                >
            </div>

            <div class="form-group">
                <label for="year">Year</label>
                <input
                    type="number"
                    id="year"
                    value="2020"
                    min="1900"
                    max="2100"
                    required
                >
            </div>

            <div class="form-group">
                <label for="rainfall">
                    Average Rainfall (mm/year)
                </label>
                <input
                    type="number"
                    id="rainfall"
                    value="1083"
                    min="0"
                    step="0.1"
                    required
                >
            </div>

            <div class="form-group">
                <label for="pesticides">
                    Pesticides (tonnes)
                </label>
                <input
                    type="number"
                    id="pesticides"
                    value="50000"
                    min="0"
                    step="0.1"
                    required
                >
            </div>

            <div class="form-group">
                <label for="temperature">
                    Average Temperature (°C)
                </label>
                <input
                    type="number"
                    id="temperature"
                    value="25"
                    step="0.1"
                    required
                >
            </div>

            <div class="form-group">
                <label for="crop">Crop Type</label>

                <select id="crop" required>
                    <option value="Maize">Maize</option>
                    <option value="Wheat">Wheat</option>
                    <option value="Rice, paddy">Rice, paddy</option>
                    <option value="Sorghum">Sorghum</option>
                    <option value="Potatoes">Potatoes</option>
                    <option value="Soybeans">Soybeans</option>
                </select>
            </div>

        </div>

        <button type="submit" class="predict-btn">
            🌱 Predict Crop Yield
        </button>

    </form>

    <div id="error" class="error"></div>

    <div id="result" class="result">

        <h2>Prediction Result</h2>

        <div class="result-value">
            <span id="predictionValue">0</span> hg/ha
        </div>

        <p style="margin-top: 8px; color: #666;">
            Predicted Crop Yield
        </p>

    </div>

</div>


<script>

const form = document.getElementById("predictionForm");

const result = document.getElementById("result");

const predictionValue =
    document.getElementById("predictionValue");

const errorMessage =
    document.getElementById("error");


form.addEventListener("submit", async function(event) {

    event.preventDefault();

    result.style.display = "none";
    errorMessage.style.display = "none";

    const data = {

        area: document.getElementById("area").value,

        year: Number(
            document.getElementById("year").value
        ),

        rainfall: Number(
            document.getElementById("rainfall").value
        ),

        pesticides: Number(
            document.getElementById("pesticides").value
        ),

        temperature: Number(
            document.getElementById("temperature").value
        ),

        crop: document.getElementById("crop").value

    };


    try {

        const response = await fetch(
            "http://127.0.0.1:5000/predict",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)
            }
        );


        const resultData = await response.json();


        if (!response.ok) {
            throw new Error(
                resultData.error ||
                "Prediction failed"
            );
        }


        predictionValue.textContent =
            Number(
                resultData.predicted_yield_hg_ha
            ).toLocaleString();


        result.style.display = "block";

    }

    catch (error) {

        errorMessage.textContent =
            "⚠️ Backend is not connected yet. " +
            "We will connect it in the next step.";

        errorMessage.style.display = "block";

    }

});

</script>

</body>
</html>
